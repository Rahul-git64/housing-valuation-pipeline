name: CI

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run unit and API integration tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container image
        run: docker build -t housing-api:ci .

      - name: Smoke-test container health, valuation intervals, and drift supervision
        run: |
          docker run -d --name housing-api -p 8000:8000 housing-api:ci
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"median_income":6.8,"house_age":22.0,"avg_rooms":6.2,"avg_bedrooms":1.2,"population":1150.0,"avg_occupancy":2.7,"latitude":37.7749,"longitude":-122.4194,"lot_area_sqft":5800.0,"overall_quality":7,"ocean_proximity":"NEAR BAY"}'
          curl -fsS http://127.0.0.1:8000/monitor/drift
          docker rm -f housing-api
